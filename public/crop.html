  </nav>

  <main class="tool-page" id="main-content">
    <div class="container">
      <div class="tool-header animate-fade-up">
        <div class="breadcrumb"><a href="index.html">Image Tools</a><span>/</span> Crop</div>
        <h1>✂️ Crop Image</h1>
        <p>Drag to select the area you want to keep.</p>
      </div>

      <div class="tool-layout-wide animate-fade-up-2">
        <div class="panel">
          <div class="drop-zone" id="dropZone" style="display:block;">
            <input type="file" id="fileInput" accept="image/*" />
            <span class="drop-zone-icon">🖼️</span>
            <div class="drop-zone-title">Drop image here</div>
          </div>
          <div id="alertArea" role="status" aria-live="polite"></div>
          <div id="cropArea" class="hidden mt-16" style="text-align:center;">
            <div id="cropWrap">
              <img id="cropImg" src="" alt="" />
              <div id="cropBox">
                <div class="crop-handle tl" data-corner="tl"></div>
                <div class="crop-handle tr" data-corner="tr"></div>
                <div class="crop-handle bl" data-corner="bl"></div>
                <div class="crop-handle br" data-corner="br"></div>
              </div>
            </div>
          </div>
        </div>

        <div>
          <div class="panel">
            <div class="panel-title">Aspect Ratio</div>
            <div style="display:flex;flex-direction:column;gap:8px;">
              <button class="btn btn-ghost" data-ratio="free">Free</button>
              <button class="btn btn-ghost" data-ratio="1:1">1:1 Square</button>
              <button class="btn btn-ghost" data-ratio="16:9">16:9 Wide</button>
              <button class="btn btn-ghost" data-ratio="4:3">4:3</button>
              <button class="btn btn-ghost" data-ratio="3:2">3:2</button>
              <button class="btn btn-ghost" data-ratio="9:16">9:16 Portrait</button>
            </div>
          </div>
          <div class="panel mt-16" id="cropInfo" style="display:none;">
            <div class="panel-title">Selection</div>
            <p class="text-xs text-muted" id="cropDims">—</p>
            <button class="btn btn-primary w-full mt-16" id="cropBtn">✂️ Crop & Download</button>
          </div>
        </div>
      </div>
    </div>
  </main>
